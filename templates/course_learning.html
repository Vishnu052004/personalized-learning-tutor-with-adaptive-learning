<!DOCTYPE html>
<html>
<head>

<title>{{ course_name }} Learning</title>

<style>

body{
font-family:Poppins;
background:#f4f6ff;
padding:40px;
}

.container{
max-width:1000px;
margin:auto;
}

.title{
text-align:center;
margin-bottom:30px;
}

.lesson{
background:white;
padding:25px;
margin-bottom:30px;
border-radius:10px;
box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

.lesson-title{
font-size:20px;
margin-bottom:15px;
font-weight:600;
}

.test-btn{
margin-top:15px;
padding:10px 20px;
background:#667eea;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h1 class="title">{{ course_name }} Course</h1>

{% for lesson in lessons %}

<div class="lesson">

<div class="lesson-title">
Lesson {{ loop.index }} : {{ lesson.title }}
</div>

{% if lesson.video_type == "mp4" %}
<video width="100%" height="420" controls controlsList="nodownload" preload="metadata">
<source src="{{ lesson.video }}" type="video/mp4">
Your browser does not support the video tag.
</video>
{% else %}
<iframe width="100%" height="420"
src="{{ lesson.video }}"
frameborder="0"
allowfullscreen>
</iframe>
{% endif %}

{% if lesson.test %}
<a href="/test/{{ course_name }}">
<button class="test-btn">
Take Test
</button>
</a>
{% endif %}

</div>

{% endfor %}

</div>

</body>
</html>
